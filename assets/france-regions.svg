<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 600 560"
  width="100%"
  height="auto"
  role="img"
  aria-labelledby="franceRegionsTitle franceRegionsDesc"
>
  <title id="franceRegionsTitle">Carte simplifiée des régions viticoles</title>
  <desc id="franceRegionsDesc">Zones cliquables : Champagne, Bourgogne, Bordeaux, Spiritueux/Cognac.</desc>

  <defs>
    <style>
      .fr-outline {
        fill: #f3eadf;
        stroke: #8a6a52;
        stroke-width: 4;
      }
      .region-shape {
        fill: #efe2d2;
        stroke: #7b553b;
        stroke-width: 3;
        transition: fill .2s ease, stroke .2s ease, opacity .2s ease;
        cursor: pointer;
      }
      .region-label {
        font-family: Inter, Arial, sans-serif;
        font-size: 18px;
        fill: #4c2f1f;
        font-weight: 700;
        pointer-events: none;
        text-anchor: middle;
      }
    </style>
  </defs>

  <!-- silhouette simple métropole -->
  <path
    class="fr-outline"
    d="M120,70
       L210,35
       L320,40
       L430,85
       L500,170
       L510,270
       L475,360
       L430,435
       L340,500
       L230,520
       L150,495
       L95,430
       L75,330
       L80,230
       L95,145 Z"
  />

  <!-- Bordeaux / Nouvelle-Aquitaine (sud-ouest) -->
  <path
    id="region-bordeaux"
    class="region-shape"
    data-region="bordeaux"
    d="M120,275
       L170,250
       L230,265
       L255,330
       L220,400
       L150,420
       L105,375
       L100,315 Z"
  />
  <text class="region-label" x="180" y="335">Bordeaux</text>

  <!-- Spiritueux / Cognac (ouest-centre) -->
  <path
    id="region-spiritueux"
    class="region-shape"
    data-region="spiritueux"
    d="M170,205
       L230,185
       L285,215
       L275,270
       L225,285
       L165,255 Z"
  />
  <text class="region-label" x="230" y="240">Spiritueux</text>

  <!-- Bourgogne (centre-est) -->
  <path
    id="region-bourgogne"
    class="region-shape"
    data-region="bourgogne"
    d="M295,205
       L350,185
       L405,220
       L410,290
       L360,335
       L300,310
       L280,255 Z"
  />
  <text class="region-label" x="345" y="265">Bourgogne</text>

  <!-- Champagne (nord-est) -->
  <path
    id="region-champagne"
    class="region-shape"
    data-region="champagne"
    d="M285,95
       L360,85
       L430,130
       L405,195
       L345,190
       L290,165
       L265,125 Z"
  />
  <text class="region-label" x="350" y="145">Champagne</text>
</svg>
